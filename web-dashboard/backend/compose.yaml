name: aluminum-auth
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: aluminum
      POSTGRES_USER: aluminum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluminum -d aluminum"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
