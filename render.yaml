databases:
  - name: aluminum-db
    plan: free
    databaseName: aluminum
    user: aluminum

services:
  - type: web
    name: aluminum-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r web-dashboard/backend/requirements.txt &&
      python web-dashboard/backend/manage.py migrate --noinput
    startCommand: >-
      gunicorn --chdir web-dashboard/backend config.wsgi:application
      --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: READINESS_TOKEN
        generateValue: true
      - key: DJANGO_TRUST_FORWARDED_PROTO
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: aluminum-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ML_ARTIFACT_DIR
        value: /opt/render/project/src/ml-part/models
      - key: DATABASE_URL
        fromDatabase:
          name: aluminum-db
          property: connectionString
